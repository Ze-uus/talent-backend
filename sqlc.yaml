version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/store/queries/"
    schema:  "./migrations/"
    gen:
      go:
        package:           "postgres"
        out:               "./internal/store/postgres"
        sql_package:       "pgx/v5"
        emit_json_tags:    false
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type:  "float64"
