  services:
  - type: web
    name: scaloo-talent-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
