services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scaloo
      POSTGRES_PASSWORD: scaloo
      POSTGRES_DB: scaloo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaloo"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgres://scaloo:scaloo@db:5432/scaloo?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
