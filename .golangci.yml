version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    rules:
      # domain.go defines enum constants used by the Postgres implementation (STEP 05).
      # They are intentionally unexported and not yet referenced.
      - path: internal/store/domain.go
        linters:
          - unused
