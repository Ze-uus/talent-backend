root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main.exe ./cmd"
bin = "./tmp/main.exe"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "bin", "testdata", "docs", "migrations", "scripts", "dev-files"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
