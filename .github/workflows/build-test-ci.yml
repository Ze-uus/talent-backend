name: Build + Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaloo
          POSTGRES_PASSWORD: scaloo
          POSTGRES_DB: scaloo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install tools
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: Run migrations
        env:
          DATABASE_URL: postgres://scaloo:scaloo@localhost:5432/scaloo_test?sslmode=disable
        run: goose -dir ./migrations postgres "$DATABASE_URL" up

      - name: Unit tests
        run: go test ./... -v -count=1 -race -timeout=60s

      - name: Integration tests
        env:
          DATABASE_URL: postgres://scaloo:scaloo@localhost:5432/scaloo_test?sslmode=disable
        run: go test ./... -tags=integration -count=1 -timeout=120s

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/scaloo ./cmd/api